name: CI Linux

# Runs on pull requests from `dev` into `main` (the release pull request) and
# on pushes to `main`, whose result the README's badge shows; it can also be
# started by hand from the Actions tab. Pull requests into `dev` get no CI:
# contributors run the same checks locally before every commit (AGENTS.md).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    # Only the pull request from `dev`, not one from any other branch.
    if: github.event_name != 'pull_request' || github.head_ref == 'dev'
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .

  test:
    if: github.event_name != 'pull_request' || github.head_ref == 'dev'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked
      - name: Test
        run: uv run pytest

  # Tests on the newest stable CPython that uv can download, so a new Python
  # release is covered before it's added to the matrix above.
  python_latest:
    if: github.event_name != 'pull_request' || github.head_ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Find the newest stable Python
        run: |
          latest=$(uv python list --only-downloads --output-format json | jq -r '
            [.[] | select(.implementation == "cpython" and .variant == "default"
                          and (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")))]
            | max_by(.version_parts | [.major, .minor, .patch]) | .version')
          echo "Newest stable Python: $latest"
          echo "UV_PYTHON=$latest" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: uv sync --locked
      - name: Test
        run: uv run pytest

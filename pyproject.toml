[project]
name = "tskmngr"
version = "0.1.0.dev0"
description = "A terminal task manager that stores tasks as Markdown files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "ruamel.yaml==0.19.1",
    "textual==8.2.8",
]

[project.scripts]
tskmngr = "tskmngr.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "ruff==0.17.3",
]

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
